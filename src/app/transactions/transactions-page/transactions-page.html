<section class="transactions-page">
  <header class="page-header">
    <h1>Transactions</h1>
    <p>Select a transaction tab to open its workflow panel.</p>
  </header>

  <mat-button-toggle-group
    class="tabs-toggle"
    [value]="selectedTab()"
    (change)="onTabChange($event.value)"
    hideSingleSelectionIndicator
  >
    @for (tab of tabs; track tab.key) {
      <mat-button-toggle [value]="tab.key">{{ tab.label }}</mat-button-toggle>
    }
  </mat-button-toggle-group>

  <mat-card appearance="outlined" class="transaction-card">
    <div class="card-header">
      <div class="card-icon">
        <mat-icon>{{ activeTab().icon }}</mat-icon>
      </div>
      <div>
        <h2>{{ activeTab().label }}</h2>
        <p>{{ activeTab().subtitle }}</p>
      </div>
    </div>

    <div class="panel-placeholder">
      <span>Selected tab:</span>
      <strong>{{ activeTab().label }}</strong>
    </div>
  </mat-card>
</section>

<div class="panel-toolbar">
  @if (canWrite()) {
    <button mat-flat-button color="primary" (click)="openCreate()">
      <mat-icon>add</mat-icon>
      {{ addLabel() }}
    </button>
  }
</div>

<mat-card appearance="outlined" class="table-card">
  @if (loading()) {
    <mat-progress-bar mode="indeterminate" />
  }

  <div class="table-scroll">
    <table mat-table [dataSource]="rows()" class="data-table">
      @for (field of columns(); track field) {
        <ng-container [matColumnDef]="field">
          <th mat-header-cell *matHeaderCellDef>{{ headerLabel(field) }}</th>
          <td mat-cell *matCellDef="let row">{{ cellValue(row, field) }}</td>
        </ng-container>
      }

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="actions-col">Actions</th>
        <td mat-cell *matCellDef="let row" class="actions-col">
          <button mat-icon-button color="primary" matTooltip="Edit" (click)="openEdit(row)" [disabled]="!canWrite()">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" matTooltip="Delete" (click)="confirmDelete(row)" [disabled]="apiMissing()">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns()"></tr>
    </table>
  </div>

  @if (!loading() && rows().length === 0) {
    <div class="empty-state">
      <mat-icon>{{ emptyIcon() }}</mat-icon>
      <p>{{ emptyMessage() }}</p>
    </div>
  }

  <mat-paginator
    [length]="total()"
    [pageSize]="pageSize()"
    [pageIndex]="pageIndex()"
    [pageSizeOptions]="[5, 10, 25]"
    (page)="onPage($event)"
  />
</mat-card>
